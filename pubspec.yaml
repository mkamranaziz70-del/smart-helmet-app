name: smart_helmet_app
description: "Smart Helmet Safety System – Firebase Realtime App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # 🔥 Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  firebase_database: ^11.1.0
  url_launcher: ^6.2.6

  # 🔐 Google Authentication
  google_sign_in: ^6.2.1

  # 🗺️ Maps (Helmet Location)

  # 🧠 State Management
  provider: ^6.1.2

  # 📡 Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google.png
    - assets/images/helmet_logo.png